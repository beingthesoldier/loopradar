<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loop Radar</title>
<meta name="description" content="Generative visuals for beats and loops. Pick a visual, try it on your own track, export a vertical video.">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header class="hdr">
  <a class="logo" href="#/all">Loop Radar</a>
  <div class="acct">
    <button class="acct-btn" type="button" aria-label="Account" aria-expanded="false" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 19.5c1.3-3.3 4-5 7.2-5s5.9 1.7 7.2 5"/></svg></button>
    <div class="acct-menu" hidden><strong>Account</strong><span>Sign in is coming soon.</span></div>
  </div>
</header>

<div class="site wrap">
  <aside class="side">
    <nav class="cats" id="cats" aria-label="Categories"></nav>
    <p class="cat-note" id="catNote"></p>
  </aside>

  <main class="main">
    <section class="grid" id="grid" aria-live="polite"></section>

    <section class="detail" id="detail" hidden>
      <a class="back" id="back" href="#/all">← All</a>
      <div class="viewer">
        <div class="screen" id="screen">
          <img id="detailPoster" alt="">
          <iframe id="preview" title="Live preview" loading="lazy"></iframe>
        </div>
        <div class="caption">
          <h1 id="detailTitle"></h1>
          <p class="meta" id="detailMeta"></p>
          <p class="about" id="detailAbout"></p>
          <a class="try" id="tryIt" href="studio/">Try it</a>
          <nav class="step" aria-label="More visuals">
            <a id="prev" href="#">← Previous</a>
            <a id="next" href="#">Next →</a>
          </nav>
        </div>
      </div>
    </section>
  </main>
</div>
<script type="module" src="assets/js/header.js"></script>
<script type="module" src="assets/js/site.js"></script>
</body>
</html>
